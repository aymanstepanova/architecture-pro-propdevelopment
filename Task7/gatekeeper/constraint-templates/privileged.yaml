apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sprivileged
spec:
  crd:
    spec:
      names:
        kind: K8sPrivileged
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |-
        package k8sprivileged

        # Запрещаем privileged: true
        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          some i
          c := input.review.object.spec.containers[i]
          c.securityContext.privileged == true
          msg := sprintf("privileged container %v is not allowed", [c.name])
        }

        # Требуем readOnlyRootFilesystem: true
        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod"
          some i
          c := input.review.object.spec.containers[i]

          not c.securityContext.readOnlyRootFilesystem
          msg := sprintf("container %v must use readOnlyRootFilesystem=true", [c.name])
        }
