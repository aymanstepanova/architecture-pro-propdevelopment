apiVersion: audit.k8s.io/v1
kind: Policy
# По умолчанию логируем только metadata
omitStages:
  - "RequestReceived"
rules:
  # Полный лог для операций с Pod в namespaces, где включён аудит безопасности
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["pods"]
    namespaces: ["audit-zone"]

  # Лог для Gatekeeper объектов (шаблоны и constraints)
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "templates.gatekeeper.sh"
        resources: ["constrainttemplates"]
      - group: "constraints.gatekeeper.sh"
        resources: ["*"]

  # Для остальных — только metadata
  - level: Metadata
    resources:
      - group: "*"
        resources: ["*"]
